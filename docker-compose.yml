x-shared-env: &shared-env
  DEBUG: ${DEBUG:-false}
  JDWP_PORT: ${JDWP_PORT:-5005}

  JMC: ${JMC:-false}
  JFR_PROFILE: ${JFR_PROFILE:-false}
  JMX_HOSTNAME: ${JMX_HOSTNAME:-localhost}
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://swiggy-service-registry:8761/eureka/

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --binlog-format=ROW
      --log-bin=mysql-bin
      --binlog-row-image=FULL
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --server-id=1
    environment:
      - MYSQL_DATABASE=javatechie
      - MYSQL_ROOT_PASSWORD=Password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  swiggy-service-registry:
    build:
      context: .
      dockerfile: swiggy-service-registry/Dockerfile
    container_name: swiggy-service-registry
    ports:
      - "8761:8761"
      - "5005:5005" # Debug port
      - "9011:9011" # JMC/JMX port
    environment:
      <<: *shared-env
      JMX_PORT: 9011
      # Ensure the service binds to all interfaces inside the container
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false

  swiggy-gateway:
    build:
      context: .
      dockerfile: swiggy-gateway/Dockerfile
    container_name: swiggy-gateway
    depends_on:
      - swiggy-service-registry
    ports:
      - "8080:8080"
      - "5006:5005" # Debug port
      - "9012:9012" # JMC/JMX port
    environment:
      <<: *shared-env
      JMX_PORT: 9012
      SERVER_PORT: 8080
      # If you use profiles or other env-based config, add them here
      # - SPRING_PROFILES_ACTIVE=docker

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    depends_on:
      - swiggy-service-registry
      - mysql
    ports:
      - "9898:9898"
      - "5007:5005" # Debug port
      - "9013:9013" # JMC/JMX port
    environment:
      <<: *shared-env
      JMX_PORT: 9013
      SERVER_PORT: 9898
      # Override DB connection to point at the mysql service container
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/javatechie
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Password

  restaurant-service:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    container_name: restaurant-service
    depends_on:
      - swiggy-service-registry
      - kafka
      - mysql
    ports:
      - "8082:8082"
      - "5008:5005" # Debug port
      - "9014:9014" # JMC/JMX port
    environment:
      <<: *shared-env
      JMX_PORT: 9014
      SERVER_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/restaurant_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Password

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-connect:
    image: debezium/connect:2.4
    container_name: kafka-connect
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-group
      CONFIG_STORAGE_TOPIC: _debezium_connect_configs
      OFFSET_STORAGE_TOPIC: _debezium_connect_offsets
      STATUS_STORAGE_TOPIC: _debezium_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      - swiggy-service-registry
      - kafka
    ports:
      - "8084:8084"
    environment:
      <<: *shared-env
      JMX_PORT: 9016
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  swiggy-app:
    build:
      context: .
      dockerfile: swiggy-app/Dockerfile
    container_name: swiggy-app
    depends_on:
      - swiggy-service-registry
    ports:
      - "8081:8081"
      - "5009:5005" # Debug port
      - "9015:9015" # JMC/JMX port
    environment:
      <<: *shared-env
      JMX_PORT: 9015
      SERVER_PORT: 8081

networks:
  default:
    external: true
    name: shared
volumes:
  mysql_data:
    external: true